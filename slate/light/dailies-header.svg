<svg xmlns="http://www.w3.org/2000/svg" width="840" height="90" viewBox="0 0 840 90" role="img" aria-label="DAILIES: latest work across public repositories"><style>:root{--bg:#ffffff;--panel:#f6f8fa;--ink:#1f2328;--line:#d0d7de;--mute:#59636e;--ok:#1a7f37;--okb:#dafbe1;--wip:#9a6700;--wipb:#fff8c5;--hold:#59636e;--holdb:#eaeef2;--fix:#cf222e;--fixb:#ffebe9}

<svg xmlns="http://www.w3.org/2000/svg" width="840" height="90" viewBox="0 0 840 90" role="img" aria-label="SHOTS: pinned repositories"><style>:root{--bg:#0d1117;--panel:#161b22;--ink:#e6edf3;--line:#30363d;--mute:#8b949e;--ok:#3fb950;--okb:#1f6f3a55;--wip:#d29922;--wipb:#9e6a0355;--hold:#8b949e;--holdb:#30363d88;--fix:#f85149;--fixb:#da363355}
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:var(--ink)}
.n{display:none}
@media (max-width:560px){.w{display:none}.n{display:inline}}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.2}}
@media (prefers-reduced-motion: reduce){.in,.pulse,.tc{animation:none!important}}

.k{fill:var(--mute);font-size:10px;letter-spacing:1.5px}
.m{fill:var(--mute)} .ln{stroke:var(--line);stroke-width:1.5;fill:none}
.bg{fill:var(--bg)} .panel{fill:var(--panel)} .ink{fill:var(--ink)}
.in{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}

<svg xmlns="http://www.w3.org/2000/svg" width="840" height="444" viewBox="0 0 840 444" role="img" aria-label="Slate: GitHub, Valentin Beaumont, Head of Pipeline at Lotchi, Paris">
  <style>
    :root{--bg:#0d1117;--ink:#e6edf3;--line:#30363d;--mute:#8b949e}
    @media (prefers-color-scheme: light){:root{--bg:#ffffff;--ink:#1f2328;--line:#d0d7de;--mute:#59636e}}
    .bg{fill:var(--bg)} .ink{fill:var(--ink)} .ln{stroke:var(--line);stroke-width:1.5;fill:none}
    text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
    .k{fill:var(--mute);font-size:11px;letter-spacing:2px}
    .v{fill:var(--ink);font-size:16px}
    .big{font-size:46px;font-weight:700;letter-spacing:8px}
    /* One clap, 2.4s: hold open, anticipate (lift), slam with gravity
       (ease-in), thump the board, then settle with decaying rebounds. */
    .arm{transform-box:fill-box;transform-origin:0 100%;animation:clap 2.4s .3s both}
    @keyframes clap{
      0%{transform:rotate(-3deg);animation-timing-function:linear}
      30%{transform:rotate(-3deg);animation-timing-function:cubic-bezier(.2,0,.3,1)}
      42%{transform:rotate(-4deg);animation-timing-function:cubic-bezier(.75,0,1,.6)}
      48%{transform:rotate(0);animation-timing-function:cubic-bezier(0,0,.3,1)}
      53%{transform:rotate(-.9deg);animation-timing-function:cubic-bezier(.7,0,1,1)}
      57.5%{transform:rotate(0);animation-timing-function:cubic-bezier(0,0,.3,1)}
      61%{transform:rotate(-.3deg);animation-timing-function:cubic-bezier(.7,0,1,1)}
      64%,100%{transform:rotate(0)}}
    .board{animation:thump 2.4s .3s both}
    @keyframes thump{0%,47.9%{transform:none}49.5%{transform:translateY(2.5px)}53%{transform:translateY(-.6px)}57%,100%{transform:none}}
    .clack{opacity:0;transform-box:view-box;transform-origin:826px 62px;animation:clack 2.4s .3s both}
    @keyframes clack{0%,47.9%{opacity:0;transform:scale(.4)}49%{opacity:1;transform:scale(.8);animation-timing-function:cubic-bezier(0,0,.3,1)}60%,100%{opacity:0;transform:scale(1.25)}}
    .rec{animation:rec 1.2s steps(1) infinite}
    @keyframes rec{50%{opacity:.15}}
    @media (prefers-reduced-motion: reduce){.arm,.board,.clack,.rec{animation:none}}
  </style>
  <defs>
    <pattern id="stripes" width="56" height="44" patternUnits="userSpaceOnUse" patternTransform="skewX(-35)">
      <rect width="28" height="44" class="ink"/>
    </pattern>
    <!-- board: square top under the arm, rounded bottom corners -->
    <clipPath id="r"><path d="M1,44 H839 V369 A10,10 0 0 1 829,379 H11 A10,10 0 0 1 1,369 Z"/></clipPath>
  </defs>
  <!-- 64px of headroom: the arm's tip rises 61px at its 4deg peak -->
  <g transform="translate(0 64)"><g class="board">
  <g clip-path="url(#r)">
    <rect y="44" width="840" height="336" class="bg"/>
    <!-- grid -->
    <line x1="0" y1="140" x2="840" y2="140" class="ln"/>
    <line x1="0" y1="212" x2="840" y2="212" class="ln"/>
    <line x1="640" y1="44" x2="640" y2="140" class="ln"/>
    <line x1="230" y1="140" x2="230" y2="212" class="ln"/>
    <line x1="440" y1="140" x2="440" y2="212" class="ln"/>
    <line x1="640" y1="140" x2="640" y2="212" class="ln"/>
    <!-- row 1 -->
    <text x="22" y="68" class="k">PROD</text>
    <text x="22" y="122" class="big ink">GITHUB</text>
    <text x="662" y="68" class="k">LAST TAKE</text>
    <circle class="rec" cx="780" cy="64" r="4" fill="#f85149" style="fill:#f85149"/>
    <text x="790" y="68" class="k" style="fill:#f85149">REC</text>
    <text x="662" y="116" class="v" style="font-size:24px">{{DATE}}</text>
    <!-- row 2 -->
    <text x="22" y="164" class="k">DIRECTOR</text>
    <text x="22" y="194" class="v">Valentin Beaumont</text>
    <text x="252" y="164" class="k">ROLE</text>
    <text x="252" y="194" class="v">Head of Pipeline</text>
    <text x="462" y="164" class="k">STUDIO</text>
    <text x="462" y="194" class="v">Lotchi · Paris</text>
    <text x="662" y="164" class="k">SINCE</text>
    <text x="662" y="194" class="v">2019</text>
    <!-- row 3 -->
    <text x="22" y="236" class="k">NOTES</text>
    <text x="22" y="268" class="v">I like chromatic aberration, glow, and useless tools.</text>
    <text x="22" y="288" class="k" style="letter-spacing:1px">Among other things.</text>
    <!-- row 4: contributions as a sound waveform, filled by scripts/build_readme.py -->
    <line x1="0" y1="298" x2="840" y2="298" class="ln"/>
    <text x="22" y="318" class="k">{{WAVE_LABEL}}</text>
    {{WAVE}}
  </g>
  <path d="M1,44 V369 A10,10 0 0 0 11,379 H829 A10,10 0 0 0 839,369 V44" class="ln"/>
  <!-- clapper arm, hinged at its bottom-left corner -->
  <g class="arm">
    <path d="M1,44 V11 A10,10 0 0 1 11,1 H829 A10,10 0 0 1 839,11 V44 Z" class="bg"/>
    <path d="M1,44 V11 A10,10 0 0 1 11,1 H829 A10,10 0 0 1 839,11 V44 Z" fill="url(#stripes)"/>
    <path d="M1,44 V11 A10,10 0 0 1 11,1 H829 A10,10 0 0 1 839,11 V44 Z" class="ln"/>
  </g>
  <line x1="0" y1="44" x2="840" y2="44" class="ln"/>
  <circle cx="14" cy="44" r="4" class="bg" style="stroke:var(--line);stroke-width:1.5"/>
  <!-- impact burst above the arm's tip -->
  <g class="clack" style="stroke:var(--ink);stroke-width:2.5;stroke-linecap:round">
    <line x1="834.7" y1="-7.0" x2="852.0" y2="-17.0"/>
    <line x1="831.0" y1="-10.7" x2="841.0" y2="-28.0"/>
    <line x1="826.0" y1="-12.0" x2="826.0" y2="-32.0"/>
    <line x1="821.0" y1="-10.7" x2="811.0" y2="-28.0"/>
    <line x1="817.3" y1="-7.0" x2="800.0" y2="-17.0"/>
  </g>
  </g></g>
</svg>
